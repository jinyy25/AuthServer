plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // mybatis
    implementation 'org.mybatis:mybatis-spring:2.0.3'
    implementation 'org.mybatis:mybatis:3.5.3'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.1.1'

    // mariaDB
    implementation 'org.mariadb.jdbc:mariadb-java-client:2.3.0'

    // elasticsearch
    implementation 'org.elasticsearch.client:elasticsearch-rest-high-level-client:7.17.15'

    // Spring Boot Starter Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // H2 Database for JPA
    runtimeOnly 'com.h2database:h2'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.22'
    annotationProcessor 'org.projectlombok:lombok:1.18.22'

    // SLF4J
    implementation 'org.slf4j:slf4j-api:1.7.32'


    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Token
    implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.2'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.2'

}

tasks.named('test') {
    useJUnitPlatform()
}
